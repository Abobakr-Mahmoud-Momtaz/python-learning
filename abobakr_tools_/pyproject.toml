[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abobakr_tools"
version = "0.1.0"
description = "A Python library developed as part of learning Python."
requires-python = ">=3.10"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
abobakr_tools = ["*.txt"]